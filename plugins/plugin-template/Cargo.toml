[package]
name = "plugin-template"
version = "0.1.0"
edition = "2024"

[dependencies]
tlock-pdk = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[package.metadata.wasm-pack.profile.release]
wasm-opt = [
    "-O",
    "--debuginfo",
    "--enable-bulk-memory",
    "--enable-nontrapping-float-to-int",
]
